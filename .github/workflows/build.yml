# Tests, then builds the installers on each OS (PyInstaller can't cross-compile).
# Pushing a tag like v0.3.0 also publishes them as a GitHub release.
name: Build installers

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Unit tests (Node is preinstalled for the JS/Python crypto check)
        working-directory: tests
        run: python -m unittest -v

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04     # oldest supported glibc, so the .deb runs on more distros
          - os: windows-latest
          - os: macos-latest     # Apple Silicon
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install . "pyinstaller>=6"

      - name: Install Inno Setup if missing
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Build
        run: python packaging/build.py

      - name: Check the built app starts (Linux)
        if: runner.os == 'Linux'
        run: dist/kumpas/kumpas --version
      - name: Check the built app starts (macOS)
        if: runner.os == 'macOS'
        run: '"dist/Kumpas.app/Contents/MacOS/Kumpas" --version'
      - name: Check the built app starts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\Kumpas\Kumpas.exe -ArgumentList '--version' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Kumpas.exe exited with $($p.ExitCode)" }

      - uses: actions/upload-artifact@v7
        with:
          name: installer-${{ runner.os }}
          path: |
            dist/*.deb
            dist/*.dmg
            dist/*-setup.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish a GitHub release with the installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "Kumpas $GITHUB_REF_NAME" --generate-notes
