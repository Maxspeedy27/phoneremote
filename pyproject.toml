[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kumpas"
version = "0.3.1"
description = "Use your phone's browser as a remote control for your laptop - slides, touchpad and keyboard."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "src/kumpas/web/vendor/LICENSE-tweetnacl.txt"]
requires-python = ">=3.9"
dependencies = [
    "pynacl>=1.5",
    "qrcode>=7",
    "pyautogui>=0.9.54",
    "pillow>=10",
    "mss>=9",
    "cryptography>=42",
    "websockets>=13",
]

[project.scripts]
kumpas = "kumpas.cli:main"

[project.gui-scripts]
kumpas-app = "kumpas.cli:app_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kumpas = ["web/*", "web/vendor/*", "web/panel/*"]
